name: R23 · Temporary Browser Lockfile Generator
on:
  push:
    branches: [feat/openblue-r23-browser-e2e]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - run: npm install --global npm@11.6.2
      - name: Rebuild updated test dependency lockfile through npm
        run: |
          npm ci
          npm install --save-dev --save-exact @playwright/test@latest
          npm audit --audit-level=low
          npm test
          npm run build
      - name: Print generated files for reviewed commit
        run: |
          node -e "const fs=require('fs');console.log('R23_LOCK_BEGIN');console.log(fs.readFileSync('package-lock.json').toString('base64'));console.log('R23_LOCK_END');console.log('R23_PACKAGE_BEGIN');console.log(fs.readFileSync('package.json').toString('base64'));console.log('R23_PACKAGE_END');"
