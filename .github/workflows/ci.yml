name: CI · Test and Build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Gate on high+ vulnerabilities in shipped dependencies. This does not
      # claim that the dev/build toolchain is risk-free.
      - name: Production dependency high-severity audit
        run: npm audit --omit=dev --audit-level=high
      # Explicitly surface known dev/build advisories without papering over
      # them by pretending the complete dependency tree is vulnerability-free.
      - name: Full dependency advisory visibility (nonblocking)
        continue-on-error: true
        run: npm audit --audit-level=high
