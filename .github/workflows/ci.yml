name: CI · Test and Build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
      - name: Pin npm version for lockfile compatibility
        run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Production dependency high-severity audit
        run: npm audit --omit=dev --audit-level=high
      # R21: audit all dependencies, including developer/build tools.
      # Any npm advisory, even LOW, now fails CI. No continue-on-error.
      - name: Full dependency audit (blocking)
        run: npm audit --audit-level=low
